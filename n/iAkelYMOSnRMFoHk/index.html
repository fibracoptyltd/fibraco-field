<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Voice note for Hendrik</title><style>
:root{--b:#0069aa;--bg:#eef2f6;--fg:#15191e}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:460px;margin:0 auto;padding:28px 16px}h1{font-size:22px;margin:0 0 4px}p{margin:0 0 18px;color:#4a525c}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.08)}audio{width:100%;margin:6px 0 18px}
button{width:100%;border:0;border-radius:12px;padding:16px;font-size:18px;font-weight:800;letter-spacing:.3px;background:var(--b);color:#fff;margin-top:10px}
button.alt{background:#fff;color:var(--b);border:2px solid var(--b)}#msg{margin-top:12px;font-size:14px;color:#4a525c;min-height:20px}</style></head>
<body><main><h1>Voice note for Hendrik</h1><p>For Hendrik van Rooyen. Play it first. If you're happy, press Share and pick WhatsApp or any other app.</p>
<div class="card"><audio id="a" controls preload="none"></audio>
<button id="s" type="button">SHARE THE VOICE NOTE</button><button id="c" class="alt" type="button">Copy the link instead</button><div id="msg">Loading the voice note...</div></div></main>
<script>
const a=document.getElementById('a'),m=document.getElementById('msg');let file=null;
fetch('voice-note.mp3',{cache:'no-store'}).then(r=>r.blob()).then(b=>{file=new File([b],'Voice_note_for_Hendrik.mp3',{type:'audio/mpeg'});a.src=URL.createObjectURL(b);m.textContent='Ready. Press play to listen.';}).catch(()=>{a.src='voice-note.mp3';m.textContent='';});
document.getElementById('s').onclick=async()=>{
  if(!file){m.textContent='Still loading, try again in a second.';return;}
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Voice note for Hendrik'});m.textContent='Shared.';}catch(e){m.textContent='';}}
  else{m.textContent='This browser cannot share the file itself. Open this link in Chrome, or use Copy the link.';}};
document.getElementById('c').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);m.textContent='Link copied.';}catch(e){m.textContent=location.href;}};
</script></body></html>
