name: probe
on: { push: { branches: [probe-server] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://ahbcixfknqgqvmauhnyo.supabase.co; A="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoYmNpeGZrbnFncXZtYXVobnlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNzI0NDMsImV4cCI6MjEwNzc0ODQ0M30.n58qy_PcGFoi9-JGzUecra9ggxUn_Yprsg9kO_2M02c"
          for i in 1 2 3; do
            echo "== round $i"
            curl -s -o /dev/null -w "rest root %{http_code} %{time_total}s\n" "$U/rest/v1/" -H "apikey: $A"
            for fn in whoami list_devices get_records put_records; do
              body='{"p_token":"probe","p_device":"probe","p_label":"probe"}'
              [ $fn = get_records ] && body='{"p_token":"probe","p_device":"probe","p_since":"2026-11-12T00:00:00Z","p_kinds":["r"]}'
              [ $fn = put_records ] && body='{"p_token":"probe","p_device":"probe","p_rows":[]}'
              [ $fn = list_devices ] && body='{"p_token":"probe","p_device":"probe"}'
              curl -s -w "\n$fn %{http_code} %{time_total}s\n" -X POST "$U/rest/v1/rpc/$fn" -H "apikey: $A" -H "Authorization: Bearer $A" -H "Content-Type: application/json" -d "$body" | tail -c 400
            done
            sleep 5
          done
